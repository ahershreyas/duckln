[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duckln"
version = "0.1.0"
description = "Duckln AI terminal mentor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "InquirerPy>=0.3.4,<1.0",
  "prompt_toolkit>=3.0.43,<4.0",
  "rich>=13.7,<14.0",
  "textual>=0.75,<1.0",
  "textual-terminal>=0.3,<1.0",
  "ptyprocess>=0.7,<1.0",
  "pywinpty>=2.0,<3.0",
  "pyte>=0.8,<1.0",
  "pywebview>=6.2,<7.0",
  "apscheduler>=3.10.4",
  "PyYAML>=6.0,<7.0",
  "SQLAlchemy>=1.4,<3.0",
  "pync>=2.0.3",
  "win10toast>=0.9",
  "nerdfonts>=1.0,<2.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
duckln = "duckln.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Plan 63: ship the bundled Symbols Nerd Font and its OFL license so the
# auto-installer (duckln.font_setup) can read them at runtime.
duckln = ["assets/fonts/*.ttf", "assets/fonts/LICENSE-*.txt"]
