[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duckln"
version = "0.1.0"
description = "Duckln AI terminal mentor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "InquirerPy>=0.3.4,<1.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
duckln = "duckln.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
