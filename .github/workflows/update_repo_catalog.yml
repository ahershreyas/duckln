name: Update Repo Catalog

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repo-catalog:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install generator dependencies
        run: python -m pip install httpx

      - name: Regenerate bundled repo catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python scripts/update_repo_catalog.py

      - name: Commit updated catalog if it changed
        run: |
          if git diff --quiet -- src/assets/repos.json; then
            echo "REPO_CATALOG_CHANGED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/repos.json
          git commit -m "chore: update bundled repo catalog"
          echo "REPO_CATALOG_CHANGED=true" >> "$GITHUB_ENV"

      - name: Push changes if needed
        run: |
          [ "${REPO_CATALOG_CHANGED}" = "true" ] || exit 0
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep 3
          done
          echo "Failed to push repo catalog update after retries."
          exit 1
